name: NoirSound Public Beta CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  forbidden-files-scan:
    name: Forbidden files scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan Git-visible files for forbidden artifacts
        run: bash scripts/check-forbidden-files.sh

  frontend-lint:
    name: Frontend lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint

  frontend-test:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify integration harness guards
        run: node --test scripts/integration/harness.test.mjs
      - run: npm test

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build

  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install backend dependencies
        run: npm ci --prefix backend
      - name: Run isolated backend migration, seed, and test suite
        run: node scripts/run-integration.mjs backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-integration-summary
          path: test-results/integration/backend-summary.json
          if-no-files-found: error

  backend-unit-security:
    name: Backend unit security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install backend dependencies
        run: npm ci --prefix backend
      - name: Check schema migrations and isolated security tests
        run: node scripts/run-integration.mjs security
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-security-summary
          path: test-results/integration/security-summary.json
          if-no-files-found: error

  playwright-e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies from lockfiles
        run: |
          npm ci
          npm ci --prefix backend
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run all 80 functional cases with isolated real services
        run: node scripts/run-integration.mjs e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-integration-summary
          path: test-results/integration/e2e-summary.json
          if-no-files-found: error

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production compose file
        run: APP_ENV_FILE=.env.production.example docker compose -f docker-compose.production.yml --env-file .env.production.example config --quiet
      - name: Build backend image
        run: docker build -t noirsound-backend ./backend
      - name: Verify shared taxonomy is in backend image
        run: |
          docker run --rm noirsound-backend sh -c "test -f src/shared/musicGenres.json && test -f src/constants/musicGenres.js" \
            || (echo 'Shared genre taxonomy missing from backend image' && exit 1)
      - name: Verify worker has FFmpeg and FFprobe
        run: docker run --rm noirsound-backend sh -c "ffmpeg -version >/dev/null && ffprobe -version >/dev/null"
      - name: Build frontend image
        run: docker build -t noirsound-web -f Dockerfile .
