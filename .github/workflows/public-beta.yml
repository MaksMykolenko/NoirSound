name: NoirSound Public Beta CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  forbidden-files-scan:
    name: Forbidden files scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan Git-visible files for forbidden artifacts
        run: bash scripts/check-forbidden-files.sh

  frontend-lint:
    name: Frontend lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint

  frontend-test:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify integration harness guards
        run: node --test scripts/integration/harness.test.mjs
      - run: npm test

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build landing-only frontend
        run: npm run build
        env:
          VITE_PUBLIC_APP_ENABLED: 'false'

  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install backend dependencies
        run: npm ci --prefix backend
      - name: Run isolated backend migration, seed, and test suite
        run: node scripts/run-integration.mjs backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-integration-summary
          path: test-results/integration/backend-summary.json
          if-no-files-found: error

  backend-unit-security:
    name: Backend unit security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install backend dependencies
        run: npm ci --prefix backend
      - name: Check schema migrations and isolated security tests
        run: node scripts/run-integration.mjs security
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-security-summary
          path: test-results/integration/security-summary.json
          if-no-files-found: error

  playwright-e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies from lockfiles
        run: |
          npm ci
          npm ci --prefix backend
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run 86 open-mode and 8 closed-mode functional cases with isolated services
        run: node scripts/run-integration.mjs e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-integration-summary
          path: test-results/integration/e2e-summary.json
          if-no-files-found: error

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production compose file
        run: APP_ENV_FILE=.env.production.example docker compose -f docker-compose.production.yml --env-file .env.production.example config --quiet
      - name: Record reproducible image metadata
        run: echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
      - name: Build backend image
        run: docker build --build-arg "GIT_SHA=$GITHUB_SHA" --build-arg "BUILD_DATE=$BUILD_DATE" -t noirsound-backend ./backend
      - name: Tag worker from its shared backend Dockerfile build
        run: docker tag noirsound-backend noirsound-worker
      - name: Verify shared taxonomy is in backend image
        run: |
          docker run --rm noirsound-backend sh -c "test -f src/shared/musicGenres.json && test -f src/constants/musicGenres.js" \
            || (echo 'Shared genre taxonomy missing from backend image' && exit 1)
      - name: Verify worker has FFmpeg and FFprobe
        run: docker run --rm noirsound-backend sh -c "ffmpeg -version >/dev/null && ffprobe -version >/dev/null"
      - name: Build frontend image
        run: docker build --build-arg "GIT_SHA=$GITHUB_SHA" --build-arg "BUILD_DATE=$BUILD_DATE" --build-arg VITE_PUBLIC_APP_ENABLED=false -t noirsound-web -f Dockerfile .
      - name: Verify exact revision, source and creation labels on all application images
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          expected_source = 'https://github.com/MaksMykolenko/NoirSound'
          for image in ['noirsound-web', 'noirsound-backend', 'noirsound-worker']:
              labels = json.loads(subprocess.check_output(['docker', 'image', 'inspect', '--format', '{{json .Config.Labels}}', image]))
              assert labels.get('org.opencontainers.image.revision') == os.environ['GITHUB_SHA'], image
              assert labels.get('org.opencontainers.image.created') == os.environ['BUILD_DATE'], image
              assert labels.get('org.opencontainers.image.source') == expected_source, image
              print(image, 'revision/source/created labels verified', os.environ['GITHUB_SHA'])
          PY

      - name: Verify production proxy routing boundaries
        run: python3 scripts/check-caddy-routing.py
