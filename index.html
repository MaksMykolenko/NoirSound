<!doctype html>
<html lang="en" data-theme="noir-pink" data-theme-preference="noir-pink">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0c" />

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-V9KSPS5WFT"></script>
    <script src="/analytics-init.js"></script>

    <!-- SSR-injected per-route metadata; see backend/src/lib/metaRenderer.js -->
    <!--noirsound:ssr-meta-->
    <title>NoirSound — your sound</title>
    <meta
      name="description"
      content="Discover independent music and beats. Listen, create, and share your sound on NoirSound."
    />
    <link rel="canonical" href="https://noirsound.co/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NoirSound" />
    <meta property="og:title" content="NoirSound — your sound" />
    <meta
      property="og:description"
      content="Discover independent music and beats. Listen, create, and share your sound on NoirSound."
    />
    <meta property="og:url" content="https://noirsound.co/" />
    <meta property="og:image" content="https://noirsound.co/og/noirsound-cover.png" />
    <meta property="og:image:secure_url" content="https://noirsound.co/og/noirsound-cover.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="NoirSound — your sound" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NoirSound — your sound" />
    <meta
      name="twitter:description"
      content="Discover independent music and beats. Listen, create, and share your sound on NoirSound."
    />
    <meta name="twitter:image" content="https://noirsound.co/og/noirsound-cover.png" />
    <meta name="twitter:image:alt" content="NoirSound — your sound" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "NoirSound",
        "url": "https://noirsound.co",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://noirsound.co/discover?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <script src="/theme-init.js"></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script type="module" src="/src/main.jsx"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
