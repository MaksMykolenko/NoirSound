# Only scripts/run-integration.mjs supplies these generated test values.
# No named volumes: each unique verification project owns transient data.
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${NS_TEST_DB_USER:?generated test user required}
      POSTGRES_PASSWORD: ${NS_TEST_DB_PASSWORD:?generated test password required}
      POSTGRES_DB: noirsound_api_test
    ports: ['127.0.0.1:${NS_TEST_DB_PORT:?generated port required}:5432']
    tmpfs: ['/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d noirsound_api_test']
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports: ['127.0.0.1:${NS_TEST_REDIS_PORT:?generated port required}:6379']
    tmpfs: ['/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30
  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${NS_TEST_S3_USER:?generated test user required}
      MINIO_ROOT_PASSWORD: ${NS_TEST_S3_PASSWORD:?generated test password required}
    command: server /data
    tmpfs: ['/data']
  storage-proxy:
    image: nginx:1.27-alpine
    depends_on: [minio]
    ports: ['127.0.0.1:${NS_TEST_STORAGE_PORT:?generated port required}:9000']
    volumes: ['../../backend/docker/nginx/storage.conf:/etc/nginx/conf.d/default.conf:ro']
